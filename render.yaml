# One-click deploy on Render (free tier): Dashboard -> New -> Blueprint -> pick this repo.
# The server builds the React app and serves it, the API and Socket.io from one address.
# Without MONGODB_URI it uses a built-in demo database that resets on restart.
# Add MONGODB_URI (e.g. a free MongoDB Atlas cluster) in Render to keep data permanently.
services:
  - type: web
    name: savor-restaurant
    runtime: node
    plan: free
    buildCommand: npm ci && CI=false npm run build && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
